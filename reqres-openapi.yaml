      description: |
        Fetches a paginated list of users using cursor-based pagination.
        **Authentication:** Not required for free tier.
      operationId: getAgentUsers
      tags:
        - Agent Sandbox
      security: []
      parameters:
        - name: cursor
          in: query
          description: Base64-encoded cursor for pagination
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
