name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements*.txt
      - name: Rebuild lock files
        env:
          CUSTOM_COMPILE_COMMAND: uvx --python 3.11 --from pip-tools==7.6.1 pip-compile --strip-extras --no-emit-index-url requirements.in
        run: |
          python -m pip install pip-tools==7.6.1
          python -m piptools compile --quiet --strip-extras --no-emit-index-url --resolver=backtracking --output-file requirements.txt requirements.in
          CUSTOM_COMPILE_COMMAND='uvx --python 3.11 --from pip-tools==7.6.1 pip-compile --strip-extras --no-emit-index-url requirements-dev.in' \
            python -m piptools compile --quiet --strip-extras --no-emit-index-url --resolver=backtracking --output-file requirements-dev.txt requirements-dev.in
      - name: Require committed locks to be current
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  backend-portable:
    needs: dependency-lock
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check supported-Python syntax
        run: python -m compileall -q app
      - name: Run portable backend suite
        run: python -m pytest tests -m "not requires_patched_sqlite" -q

  backend-coordination:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - name: Install exact dependencies and patched SQLite binding
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install pysqlite3-binary==0.5.4.post2
      - name: Run complete backend suite with verified SQLite
        run: python tests/run_with_patched_sqlite.py tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jmeter-agent-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jmeter-agent-frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run tests
        run: npm run test:run
      - name: Type-check and build
        run: npm run build
